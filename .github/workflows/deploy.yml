name: Deploy to GitHub Pages

# Manual-only by design: pushing to main backs work up to GitHub but does NOT
# publish. Deploys run only when explicitly triggered (Actions tab -> Run
# workflow, or `gh workflow run deploy.yml`).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public by design — scoped to the destination email on web3forms.com.
      NEXT_PUBLIC_WEB3FORMS_KEY: 8d8aeb15-8805-4e38-ba49-9cc44870ca71
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm's lockfile omits some Linux-only optional native deps resolved on
      # Windows, which trips `npm ci`; a plain install resolves per-platform.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
